name: CI

on:
  push:
    # Branch pushes only: a bare push trigger also fires on every tag autorelease creates.
    branches: ['**']

# go-toolchain's autorelease needs actions/contents/deployments write access; without it a passing build still fails.
permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@master
