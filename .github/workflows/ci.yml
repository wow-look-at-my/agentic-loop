name: CI

on:
  push:

# Everything past the minimal pair is required by go-toolchain@v1's autorelease
# step (default on): actions: read is verified up front, contents: write backs
# the dependency-graph submission, and deployments: write registers the
# buildhost publish as a GitHub Deployment -- a step that cannot be turned off,
# so without it a fully-passing build still fails.
permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          working-directory: go
