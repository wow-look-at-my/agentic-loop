name: CI

on:
  push:
    # Branch pushes only: a bare push trigger also fires on every tag autorelease creates.
    branches: ['**']

concurrency:
  group: gha_${{ github.repository }}_${{ github.workflow }}_${{ github.ref != 'refs/heads/master' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# go-toolchain's autorelease needs actions/contents/deployments write access; without it a passing build still fails.
permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  build:
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      # The newest published go-toolchain, handed to the action as binary: the action then skips its own download.
      - uses: wow-look-at-my/buildhost/.github/actions/buildhost-download@lkgb
        id: gt
        with:
          project: go-toolchain
          path: ${{ runner.temp }}/go-toolchain
      - uses: wow-look-at-my/go-toolchain@master
        with:
          binary: ${{ steps.gt.outputs.path }}
